[project]
name = "anchorline"
version = "0.1.0"
description = "AI wealth-intelligence layer for relationship managers. SingHacks 2026, Julius Baer track."
readme = "README.md"
# Pinned below 3.14: pandas wheels are not reliably published for 3.14 yet, and
# the local default interpreter is 3.14.0. uv will fetch a suitable runtime.
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "mcp>=1.2",
    "rank-bm25>=0.2.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# eval_*.py as well as test_*.py. The Assist eval is a measurement first and a
# test second, and it keeps that name because `make eval` is how it is read -
# but it has to run under `make test` too, or the floors it commits to would
# only ever be checked by somebody who remembered to ask.
python_files = ["test_*.py", "eval_*.py"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Explicit: auto-discovery fails because data/, docs/ and tests/ sit at the root.
[tool.setuptools.packages.find]
include = ["engine*"]
